name: Publish

on:
  push:
    branches: [main]
    paths: ['plugins/**', 'scripts/**', 'public/**', '.github/workflows/publish.yml']
  # 插件发新版不用提 PR：定时重读各仓库的默认分支，市场里的版本号、描述跟着变
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # fork 没有 Pages，只在主仓库跑
    if: github.repository == 'QFlareBot/plugins'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 读不到的插件沿用上一版索引里的数据，所以要带上线上那一份
      - run: npm run index
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: cp -R public/. site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
